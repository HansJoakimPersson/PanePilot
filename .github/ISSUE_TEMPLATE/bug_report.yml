name: Bug report
description: Report a reproducible problem in PanePilot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this template for real defects in PanePilot. Include concrete steps and environment details so the bug can be reproduced.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: PanePilot stops showing snap regions after waking the Mac from sleep.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable reproduction sequence.
      placeholder: |
        1. Launch PanePilot
        2. Open Settings
        3. Change the snap modifier to Option
        4. Drag a Finder window while holding Option
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Snap regions should appear when dragging with the configured modifier.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: No regions appear until the app is relaunched.
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - GitHub release
        - Local build from source
        - Xcode run
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: PanePilot version
      description: Use the About window or release tag if possible.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: macOS 15.7.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant log lines or attach screenshots if they help explain the problem.
      render: shell

