name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Resolve bundle version
        id: version
        run: |
          marketing_version="$(awk -F' = ' '/^MARKETING_VERSION = / { print $2; exit }' Config/Version.xcconfig)"
          build_number="$(awk -F' = ' '/^CURRENT_PROJECT_VERSION = / { print $2; exit }' Config/Version.xcconfig)"
          echo "marketing_version=${marketing_version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"

      - name: Package app bundle
        run: make package CONFIGURATION=release VERSION="${{ steps.version.outputs.marketing_version }}" BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: PanePilot-ci-build-${{ steps.version.outputs.marketing_version }}
          path: dist/*
          if-no-files-found: error
